<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="PoGo Wave Radar — never miss a Pokémon GO event. Chase the event wave across time zones, pick a city, copy coords, spoof!">
<title> PoGo Wave Radar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="img/icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>🌊 PoGo Wave Radar</h1>
  <p class="tagline">Never miss a Pokémon GO event again — chase the wave across time zones</p>
  <div class="tzbar">
    <label for="tz">Your timezone</label>
    <select id="tz" title="Timezone"></select>
    <span id="tzclock"></span>
  </div>
  <div class="filters">
    <label class="switch"><input type="checkbox" id="pvp"> Show PvP / GBL (hidden by default)</label>
  </div>
  <div id="donateTop"></div>
</header>

<nav class="tabs">
  <button data-tab="live" class="active">🔥 Live Now</button>
  <button data-tab="wave">🌊 Wave Tracker</button>
  <button data-tab="all">📅 All Events</button>
</nav>

<main>
  <section id="live"><div class="empty">Loading…</div></section>

  <section id="wave" hidden>
    <div class="wavebar">
      <label for="waveSel">Pick an event:</label>
      <select id="waveSel"></select>
    </div>
    <div id="waveList"></div>
  </section>

  <section id="all" hidden></section>
</main>

<footer>
  <p>Event data from <a href="https://leekduck.com/events/" target="_blank" rel="noopener">leekduck.com</a> · updated <span id="fetched">—</span></p>
  <p class="tiny">For spoofers: use the coords in GPS Joystick at your own risk. Respect cooldown &amp; fair play.</p>
</footer>

<div id="toast"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
