name: scrape-leekduck

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape leekduck events + details
        run: python scripts/scrape_events.py
      - name: Translate EN -> BM (DeepSeek, best-effort)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/translate_details.py || echo "translation skipped (best-effort)"
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/events.json docs/event_summaries.json docs/details.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update events + details ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "events unchanged — nothing to commit"
          fi
