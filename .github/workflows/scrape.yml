name: scrape-leekduck

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape leekduck events
        run: python scripts/scrape_events.py
      - name: Commit events.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/events.json docs/event_summaries.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update events ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "events.json unchanged — nothing to commit"
          fi
